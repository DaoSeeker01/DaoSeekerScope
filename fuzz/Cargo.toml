[package]
name = "daoseeker-scope-fuzz"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
[package.metadata]
cargo-fuzz = true
[workspace]
[dependencies]
libfuzzer-sys = "0.4"
daoseeker-scope = { path = "../crates/daoseeker-scope" }
daoseeker-scope-linux = { path = "../crates/daoseeker-scope-linux", features = ["fuzzing"] }
daoseeker-scope-macos = { path = "../crates/daoseeker-scope-macos", features = ["fuzzing"] }
daoseeker-scope-cli = { path = "../crates/daoseeker-scope-cli" }
daoseeker-scope-windows = { path = "../crates/daoseeker-scope-windows", features = ["fuzzing"] }
[[bin]]
name = "snapshot_json"
path = "fuzz_targets/snapshot_json.rs"
test = false
doc = false
bench = false
[[bin]]
name = "dmi_text"
path = "fuzz_targets/dmi_text.rs"
test = false
doc = false
bench = false

[[bin]]
