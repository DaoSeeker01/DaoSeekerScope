[package]
name = "daoseeker-scope-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "DaoSeekerScope windows"
[lints]
workspace = true
[features]
default = []
fuzzing = []
[dependencies]
daoseeker-scope-core.workspace = true
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", default-features = false, features = ["std", "Win32_Foundation", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { workspace = true, features = ["Win32_Devices_Display", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Devices_DeviceAndDriverInstallation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_Security", "Win32_System_Threading"] }
