name: 问题报告
description: 报告可复现的采集、CLI、JSON、FFI 或构建问题。
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        请先搜索已有 Issue。安全漏洞请按 SECURITY.md 私密报告。
        不要粘贴完整硬件快照、序列号、MAC、设备路径或含隐私的日志。
  - type: input
    id: revision
    attributes:
      label: 版本或提交
      placeholder: "例如：main 的提交号；当前尚无正式发布版"
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统和版本、CPU 架构、Rust 版本，以及使用 Rust/CLI/C/Python 哪个入口。容器或沙盒请注明。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 给出命令或小段代码，说明实际结果和预期结果。用合成值替换敏感信息。
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: 已脱敏的诊断信息
      description: 如字段 ID、availability、source、reason 和错误码；不需要完整 JSON。
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前检查
      options:
        - label: 我已移除敏感信息；此报告不包含未公开漏洞的利用细节。
          required: true
