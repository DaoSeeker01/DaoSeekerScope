name: desktop-contracts
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      scope:
        description: Validation scope (normal pushes always run all jobs)
        type: choice
        default: all
        options: [all, linux-candidate, native-probe, fuzz-extended]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.scope || 'all' }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
jobs:
  desktop:
    if: inputs.scope != 'fuzz-extended'
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.scope == 'linux-candidate' && '["ubuntu-24.04"]' || '["windows-latest","ubuntu-24.04","macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Pinned toolchain
        run: rustup toolchain install 1.96.0 --profile minimal --component rustfmt --component clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: macOS memory SDK preflight
        if: runner.os == 'macOS'
        run: |
          mkdir -p target
          cc -Wall -Wextra -Werror -std=c11 docs/research/macos_memory_probe.c -o target/macos-memory-probe
          target/macos-memory-probe < /dev/null | tee target/macos-memory-initial-sdk.json
          cargo test --locked -p daoseeker-scope-macos public_vm_memory_read_matches_rust_sdk_contract -- --nocapture
          cargo build --locked -p daoseeker-scope --example dynamic_probe
          target/debug/examples/dynamic_probe < /dev/null > target/macos-memory-initial-rust.json
      - name: macOS uptime SDK preflight
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror -std=c11 docs/research/macos_uptime_probe.c -o target/macos-uptime-probe
          target/macos-uptime-probe < /dev/null > target/macos-uptime-initial-sdk.json
          cargo test --locked -p daoseeker-scope-macos public_boot_time_and_time_match_native_sdk_contract -- --nocapture
      - run: cargo test --locked --workspace --all-features -- --test-threads=1
      - run: cargo check --locked -p daoseeker-scope-core --no-default-features
      - run: cargo check --locked -p daoseeker-scope --no-default-features
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"
      - run: cargo build --locked -p daoseeker-scope-ffi -p daoseeker-scope-cli
      - name: Python dev schema validator
        run: python -m pip install -r requirements-dev.txt
      - name: Python static checks
        run: |
          ruff format --check scripts tests examples/collect.py
          ruff check scripts tests examples/collect.py
          mypy --no-incremental --ignore-missing-imports scripts tests examples/collect.py
      - name: Evidence and project guards
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Project data and documentation links
        run: python scripts/check_project.py
      - name: Dependency notice inventory (not distribution approval)
        run: python scripts/notice_audit.py --offline
      - name: Frozen v0.1 manifest Schema and native ABI contract
        run: python scripts/check_contract.py
      - name: Crate archives and isolated consumer
        run: python scripts/check_packages.py
      - name: Preserve package evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: package-evidence-${{ runner.os }}-${{ runner.arch }}
          path: target/package-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - run: python scripts/check_schema.py
      - name: Windows portable CLI candidate install and rollback
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundle = python scripts/cli_bundle.py
          if ($LASTEXITCODE -ne 0) { throw 'CLI candidate build failed' }
          python scripts/cli_bundle_smoke.py $bundle
          if ($LASTEXITCODE -ne 0) { throw 'CLI candidate rehearsal failed' }
          [System.IO.File]::WriteAllText('target/windows-cli-archive.txt', $bundle.Trim())
      - name: Preserve Windows CLI candidate evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cli-bundle-evidence-Windows-X64
          path: target/cli-bundle-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Linux portable CLI candidate install and rollback
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bundle=$(bash scripts/build_linux_candidate.sh cli)
          python scripts/cli_bundle_smoke.py "$bundle"
          printf '%s\n' "$bundle" > target/linux-cli-archive.txt
      - name: Preserve Linux CLI candidate evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: cli-bundle-evidence-Linux-X64
          path: target/cli-bundle-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Windows FFI SDK candidate C and Python consumers
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdk = python scripts/cli_bundle.py --product ffi_sdk
          if ($LASTEXITCODE -ne 0) { throw 'FFI SDK build failed' }
          python scripts/ffi_bundle_smoke.py $sdk
          if ($LASTEXITCODE -ne 0) { throw 'FFI SDK rehearsal failed' }
          [System.IO.File]::WriteAllText('target/windows-sdk-archive.txt', $sdk.Trim())
      - name: Windows import symbols against Microsoft DUMPBIN
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $cli = [System.IO.File]::ReadAllText('target/windows-cli-archive.txt').Trim()
          $sdk = [System.IO.File]::ReadAllText('target/windows-sdk-archive.txt').Trim()
          python scripts/windows_imports_smoke.py $cli $sdk
          if ($LASTEXITCODE -ne 0) { throw 'Windows import symbol comparison failed' }
      - name: Preserve Windows FFI SDK evidence
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ffi-sdk-evidence-Windows-X64
          path: target/ffi-bundle-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Linux FFI SDK candidate C and Python consumers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sdk=$(bash scripts/build_linux_candidate.sh ffi_sdk)
          python scripts/ffi_bundle_smoke.py "$sdk"
          printf '%s\n' "$sdk" > target/linux-sdk-archive.txt
      - name: Linux candidates in pinned older userlands
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          IFS= read -r cli < target/linux-cli-archive.txt
          IFS= read -r sdk < target/linux-sdk-archive.txt
          python scripts/linux_runtime_container_smoke.py "$cli" "$sdk"
      - name: Preserve Linux FFI SDK evidence
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ffi-sdk-evidence-Linux-X64
          path: target/ffi-bundle-evidence.json
          if-no-files-found: ignore
          retention-days: 14
      - name: C FFI on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\debug\c-example.exe /Fotarget\debug\c-example.obj examples\collect.c target\debug\daoseeker_scope_ffi.dll.lib
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\display-probe.exe /Fotarget\display-probe.obj docs\research\display_probe.c user32.lib
          if errorlevel 1 exit /b 1
          target\display-probe.exe > target\windows-display-probe.json
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\memory-probe.exe /Fotarget\memory-probe.obj docs\research\memory_probe.c
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\cpu-probe.exe /Fotarget\cpu-probe.obj docs\research\cpu_probe.c
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\uptime-probe.exe /Fotarget\uptime-probe.obj docs\research\uptime_probe.c
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\cpu-groups-probe.exe /Fotarget\cpu-groups-probe.obj docs\research\cpu_groups_probe.c
          if errorlevel 1 exit /b 1
          cl /nologo /W4 /WX /std:c11 /Fetarget\hardware-summary-probe.exe /Fotarget\hardware-summary-probe.obj docs\research\hardware_summary_probe.c Advapi32.lib
          if errorlevel 1 exit /b 1
      - name: Windows fresh memory SDK and bounded pressure experiment
        if: runner.os == 'Windows'
        run: |
          cargo build --locked -p daoseeker-scope --example dynamic_probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/windows_memory_smoke.py
      - name: Windows fresh CPU SDK and persistent refresh
        if: runner.os == 'Windows'
        run: python scripts/windows_cpu_smoke.py
      - name: Windows uptime SDK bracket and persistent refresh
        if: runner.os == 'Windows'
        run: python scripts/windows_uptime_smoke.py
      - name: Windows CPU group SDK and persistent facade regression
        if: runner.os == 'Windows'
        run: python scripts/windows_cpu_groups_smoke.py
      - name: Windows hardware summary SDK and static cache
        if: runner.os == 'Windows'
        run: python scripts/windows_hardware_summary_smoke.py
      - name: Build C example on Linux
        if: runner.os == 'Linux'
        run: |
          cc -Wall -Wextra -Werror examples/collect.c -Ltarget/debug -ldaoseeker_scope_ffi -Wl,-rpath,"$PWD/target/debug" -o target/debug/c-example
      - name: Build C example on macOS
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror examples/collect.c -Ltarget/debug -ldaoseeker_scope_ffi -Wl,-rpath,"$PWD/target/debug" -o target/debug/c-example
      - name: Native smoke evidence
        run: python scripts/native_smoke.py
      - name: Release C ABI process peak memory
        timeout-minutes: 10
        run: python scripts/peak_memory.py
      - name: Two-minute cached C ABI sampling trial
        timeout-minutes: 8
        run: python scripts/timed_soak.py --seconds 120
      - name: Cached C ABI handle and descriptor regression
        timeout-minutes: 8
        run: python scripts/resource_regression.py
      - name: macOS public IOMedia SDK probe
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror -std=c11 docs/research/iomedia_probe.c -framework IOKit -framework CoreFoundation -o target/iomedia-probe
          target/iomedia-probe > target/macos-iomedia-probe.json
      - name: macOS fresh CPU public SDK and persistent refresh
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror -std=c11 docs/research/macos_cpu_probe.c -o target/macos-cpu-probe
          cargo build --locked -p daoseeker-scope --example dynamic_probe
          python scripts/macos_cpu_smoke.py
      - name: macOS internal battery public SDK comparison
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror -std=c11 docs/research/macos_battery_probe.c -framework IOKit -framework CoreFoundation -o target/macos-battery-probe
          python scripts/macos_battery_smoke.py
      - name: macOS Mach-O metadata versus Apple tools
        if: runner.os == 'macOS'
        run: python scripts/macos_macho_smoke.py
      - name: macOS collection benchmark
        if: runner.os == 'macOS'
        run: cargo bench --locked -p daoseeker-scope --bench collect > target/macos-collect-benchmark.log
      - name: macOS checked memory public SDK and persistent refresh
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror -std=c11 docs/research/macos_memory_probe.c -o target/macos-memory-probe
          cargo build --locked -p daoseeker-scope --example dynamic_probe
          python scripts/macos_memory_smoke.py
      - name: macOS checked uptime SDK bracket and persistent refresh
        if: runner.os == 'macOS'
        run: python scripts/macos_uptime_smoke.py
      - name: macOS public Metal SDK probe
        if: runner.os == 'macOS'
        run: |
          clang -Wall -Wextra -Werror -fobjc-arc docs/research/metal_probe.m -framework Metal -framework Foundation -o target/metal-probe
          target/metal-probe > target/macos-metal-probe.json
      - name: macOS active display SDK probe
        if: runner.os == 'macOS'
        run: |
          cc -Wall -Wextra -Werror -std=c11 docs/research/macos_display_probe.c -framework CoreGraphics -o target/macos-display-probe
          target/macos-display-probe > target/macos-display-probe.json
          python scripts/macos_display_probe.py
      - name: Linux storage collection benchmark
        if: runner.os == 'Linux'
        run: cargo bench --locked -p daoseeker-scope --bench collect > target/linux-collect-benchmark.log
      - name: Human readable sensor observations
        run: cargo run --locked --quiet -p daoseeker-scope-cli -- sensors
      - name: Preserve native evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: native-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            target/native-evidence.json
            target/contract-evidence.json
            target/notice-audit-evidence.json
            target/windows-imports-evidence.json
            target/windows-display-probe.json
            target/windows-memory-evidence.json
            target/windows-cpu-evidence.json
            target/windows-uptime-evidence.json
            target/windows-cpu-groups-evidence.json
            target/windows-hardware-summary-evidence.json
            target/macos-collect-benchmark.log
            target/macos-iomedia-probe.json
            target/macos-cpu-evidence.json
            target/macos-memory-evidence.json
            target/macos-memory-initial-sdk.json
            target/macos-memory-initial-rust.json
            target/macos-uptime-initial-sdk.json
            target/macos-uptime-evidence.json
            target/macos-battery-evidence.json
            target/macos-macho-evidence.json
            target/macos-metal-probe.json
            target/macos-display-probe.json
            target/macos-display-comparison.json
            target/linux-collect-benchmark.log
            target/linux-runtime-container-evidence.json
            target/peak-memory-evidence.json
            target/timed-soak-evidence.json
            target/timed-soak-evidence.ndjson
            target/resource-evidence.json
          if-no-files-found: ignore
          retention-days: 14
  linux-container:
    if: inputs.scope != 'linux-candidate' && inputs.scope != 'native-probe' && inputs.scope != 'fuzz-extended'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo build --locked -p daoseeker-scope-cli
      - run: python -m pip install jsonschema==4.25.1
      - name: Kernel-enforced filesystem degradation
        run: python scripts/linux_container_smoke.py
      - run: cargo build --locked -p daoseeker-scope --example dynamic_probe
      - name: CPU sampling failure and recovery
        run: python scripts/linux_dynamic_smoke.py
      - name: Memory and uptime failure and recovery
        run: python scripts/linux_memory_smoke.py
      - name: Battery enumeration failure and recovery
        run: python scripts/linux_battery_smoke.py
      - name: Static block capacity permission and cache semantics
        run: python scripts/linux_storage_smoke.py
      - name: DRM device names permission and static cache
        run: python scripts/linux_gpu_smoke.py
      - name: Connected DRM privacy, EDID permission and static cache
        run: python scripts/linux_display_smoke.py
      - name: Hwmon unit routing failure and recovery
        run: python scripts/linux_hwmon_smoke.py
      - name: Preserve container evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: linux-container-evidence
          path: |
            target/linux-container-evidence.json
            target/linux-dynamic-evidence.json
            target/linux-memory-evidence.json
            target/linux-battery-evidence.json
            target/linux-hwmon-evidence.json
            target/linux-storage-evidence.json
            target/linux-gpu-evidence.json
            target/linux-display-evidence.json
          if-no-files-found: ignore
          retention-days: 14
  supply-chain:
    if: inputs.scope != 'linux-candidate' && inputs.scope != 'native-probe' && inputs.scope != 'fuzz-extended'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install 1.96.0 --profile minimal
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny check
  fuzz-smoke:
    if: inputs.scope != 'linux-candidate' && inputs.scope != 'native-probe'
    runs-on: ubuntu-24.04
    name: ${{ matrix.group == 'all' && 'fuzz-smoke' || format('fuzz-extended ({0})', matrix.group) }}
    timeout-minutes: ${{ inputs.scope == 'fuzz-extended' && 35 || 20 }}
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(inputs.scope == 'fuzz-extended' && '["interfaces","procfs","sysfs","binary-layouts"]' || '["all"]') }}
    env:
      FUZZ_SECONDS: ${{ inputs.scope == 'fuzz-extended' && '300' || '60' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install nightly-2026-10-08 --profile minimal
      - run: cargo +nightly-2026-10-08 install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo +nightly-2026-10-08 check --locked --manifest-path fuzz/Cargo.toml
      - name: Fuzz harness observation regression
        run: cargo +nightly-2026-10-08 test --locked --manifest-path fuzz/Cargo.toml --lib
      - run: mkdir -p target/procfs-fuzz
      - name: Fuzz snapshot_json
        if: matrix.group == 'all' || matrix.group == 'interfaces'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run snapshot_json -- -max_total_time="$FUZZ_SECONDS" -max_len=1048577 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/snapshot_json.log
      - name: Fuzz dmi_text
        if: matrix.group == 'all' || matrix.group == 'interfaces'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run dmi_text -- -max_total_time="$FUZZ_SECONDS" -max_len=8192 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/dmi_text.log
      - name: Fuzz cli_args
        if: matrix.group == 'all' || matrix.group == 'interfaces'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run cli_args -- -max_total_time="$FUZZ_SECONDS" -max_len=8192 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/cli_args.log
      - name: Fuzz CPU state and bounded stat parsing
        if: matrix.group == 'all' || matrix.group == 'procfs'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run cpu_stat -- -seed=20261010 -max_total_time="$FUZZ_SECONDS" -max_len=8192 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/cpu_stat.log
      - name: Fuzz meminfo parsing and field isolation
        if: matrix.group == 'all' || matrix.group == 'procfs'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run meminfo -- -seed=20261010 -max_total_time="$FUZZ_SECONDS" -max_len=8192 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/meminfo.log
      - name: Fuzz uptime parsing and numeric boundaries
        if: matrix.group == 'all' || matrix.group == 'procfs'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run uptime -- -seed=20261010 -max_total_time="$FUZZ_SECONDS" -max_len=512 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/uptime.log
      - name: Fuzz power supply attribute boundaries
        if: matrix.group == 'all' || matrix.group == 'sysfs'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run power_supply -- -seed=20261010 -max_total_time="$FUZZ_SECONDS" -max_len=512 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/power_supply.log
      - name: Fuzz bounded hwmon millidegrees
        if: matrix.group == 'all' || matrix.group == 'sysfs'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run hwmon_temperature -- -seed=20261010 -max_total_time="$FUZZ_SECONDS" -max_len=512 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/hwmon_temperature.log
      - name: Fuzz bounded network counters and privacy
        if: matrix.group == 'all' || matrix.group == 'binary-layouts'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run network_dev -- -seed=20261011 -max_total_time="$FUZZ_SECONDS" -max_len=524289 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/network_dev.log
      - name: Fuzz Darwin routing message boundaries
        if: matrix.group == 'all' || matrix.group == 'binary-layouts'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run macos_network -- -seed=20261011 -max_total_time="$FUZZ_SECONDS" -max_len=524289 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/macos_network.log
      - name: Fuzz checked block sector conversion
        if: matrix.group == 'all' || matrix.group == 'sysfs'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run storage_capacity -- -seed=20261012 -max_total_time="$FUZZ_SECONDS" -max_len=512 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/storage_capacity.log
      - name: Fuzz bounded Windows processor group topology
        if: matrix.group == 'all' || matrix.group == 'binary-layouts'
        run: |
          set -o pipefail
          cargo +nightly-2026-10-08 fuzz run windows_cpu_groups -- -seed=20261024 -max_total_time="$FUZZ_SECONDS" -max_len=1025 -timeout=2 -rss_limit_mb=512 2>&1 | tee target/procfs-fuzz/windows_cpu_groups.log
      - name: Preserve fuzz logs and failure reproducers
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ${{ matrix.group == 'all' && 'procfs-fuzz-evidence' || format('extended-fuzz-{0}', matrix.group) }}
          path: |
            target/procfs-fuzz/*.log
            fuzz/artifacts/
          if-no-files-found: ignore
          retention-days: 14
  miri:
    if: inputs.scope != 'linux-candidate' && inputs.scope != 'native-probe' && inputs.scope != 'fuzz-extended'
    timeout-minutes: 20
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - run: rustup toolchain install nightly-2026-10-08 --profile minimal --component miri --component rust-src
      - run: cargo +nightly-2026-10-08 miri test --locked -p daoseeker-scope-ffi --target x86_64-unknown-linux-gnu memory_contracts -- --test-threads=1
  ffi-asan:
    if: inputs.scope != 'linux-candidate' && inputs.scope != 'native-probe' && inputs.scope != 'fuzz-extended'
    timeout-minutes: 25
    runs-on: ubuntu-24.04
    env:
      RUSTFLAGS: "-Zsanitizer=address"
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
    steps:
