[workspace]
members = ["crates/*"]
exclude = ["docs/research/probe", "fuzz"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/DaoSeeker01/DaoSeekerScope"

[workspace.dependencies]
daoseeker-scope-core = { path = "crates/daoseeker-scope-core", version = "0.1.0" }
daoseeker-scope-sysinfo = { path = "crates/daoseeker-scope-sysinfo", version = "0.1.0" }
daoseeker-scope-windows = { path = "crates/daoseeker-scope-windows", version = "0.1.0" }
daoseeker-scope-linux = { path = "crates/daoseeker-scope-linux", version = "0.1.0" }
daoseeker-scope-macos = { path = "crates/daoseeker-scope-macos", version = "0.1.0" }
daoseeker-scope = { path = "crates/daoseeker-scope", version = "0.1.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
schemars = "1.0"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "apple-app-store"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_SystemInformation", "Win32_System_Power"] }
libc = "0.2"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
